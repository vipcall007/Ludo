name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project (mobile-upload friendly — zip uploaded as a single file)
        run: |
          if [ -f LudoRoyale-Phase1.zip ]; then
            unzip -o LudoRoyale-Phase1.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: LudoRoyale
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoRoyale-debug-apk
          path: LudoRoyale/app/build/outputs/apk/debug/app-debug.apk
